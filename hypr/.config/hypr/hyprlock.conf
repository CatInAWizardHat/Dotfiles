background {
    path = $HOME/Pictures/Mountains.jpg # Use the same wallpaper path as hyprpaper
    blur_passes = 3
    blur_size = 8
}

input-field {
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    outer_color = rgb(1e1e2e)
    inner_color = rgb(313244)
    font_color = rgb(cdd6f4)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    border_radius = 15
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.9)
    font_size = 60
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}
