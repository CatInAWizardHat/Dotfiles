;;import colors
include-file = $HOME/.config/polybar/colors.ini
include-file = $HOME/.config/polybar/modules.ini


[settings]
screenchange-reload = true
pseudo-transparency = true

[bar/i3]
;wm-restack = i3
width = 100%
height = 20pt
radius = 0
; dpi = 96
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2pt

border-bottom-size = 1
border-bottom-color = ${colors.background}

padding-left = 1
padding-right = 1
module-margin = 1

separator = |
separator-foreground = ${colors.black}
font-0 = JetBrainsMono Nerd Font:style:Regular:size=10;3
font-1 = JetBrainsMono Nerd Font:style=Bold:size=10;3
;font-1 = Symbols Nerd Font:size=10;2

modules-left = i3 arch-updates network ip
modules-center = xwindow
modules-right = cpu home memory date bat0 bat1

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
override-redirect = false
;
; vim:ft=dosini
